# UI strings per language. Page bodies live in _pages/about.<lang>.md.
# `langs` order drives the language switcher; `root` is where a language
# falls back when a page has no translated sibling.
langs:
  - code: en
    label: EN
    root: /
  - code: ja
    label: 日本語
    root: /ja/
  - code: zh
    label: 中文
    root: /zh/

en:
  # name_html goes in the <h1> / navbar; name is the plain-text <title>.
  # Footer and machine-readable metadata stay English on every page.
  name: Yuantian Huang
  name_html: <span class="font-weight-bold">Yuantian</span> Huang
  news: news
  latest_posts: latest posts
  selected_papers: selected publications

ja:
  name: 黄 源天
  name_html: 黄&nbsp;<span class="font-weight-bold">源天</span>
  news: お知らせ
  latest_posts: 最近の投稿
  selected_papers: 主要論文

zh:
  name: 黄 源天
  name_html: 黄&nbsp;<span class="font-weight-bold">源天</span>
  news: 动态
  latest_posts: 最新文章
  selected_papers: 代表论文
